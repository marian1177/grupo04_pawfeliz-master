<!DOCTYPE html>
<html class="no-js">
  <html>
    <head>
      <meta charset="utf-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <title>Registro y Login en PawFeliz</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="stylesheet" href="css/estilos_formulario.css" />
      <link rel="stylesheet" href="css/footer.css" />
      <link rel="stylesheet" href="css/header.css" />
      <link rel="stylesheet" href="css/chatbot.css" />
      <link rel="stylesheet" href="css/fontello.css" />
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      />
    </head>
    <body>
        <header>
            <div class="contenido">
              <h1 class="icon-paw">
                PawFelíz
              </h1>
              <input type="checkbox" id="btn-menu" />
              <label class="icon-menu" for="btn-menu"></label>
              <nav class="menu">
                <ul>
                  <li><a href="ingreso.html">Ingreso</a></li>
                  <li><a href="comprar.html">Comprar</a></li>
                  <li><a href="Paw_Tips.html">Paw Tips</a></li>
                </ul>
              </nav>
            </div>
          </header>

      <main>
        <div class="contenedor">
          <div class="contenedor_login">
            <div class="login">
              <h3>
                ¿Tenes Cuenta?<br />
                Registrate
              </h3>
              <p>Inicia Sesión para entrar</p>
              <button id="boton_inicio">Iniciar Sesión</button>
            </div>
            <div class="registros">
              <h3>¿No tenes cuenta?</h3>
              <p>Registrate para Iniciar Sesión</p>
              <button id="boton_registrarse">Registrate</button>
            </div>
          </div>
          <div class="contenedor_login_registros">
            <form action="" class="formulario_login">
              <h2>Iniciar Sesión</h2>
              <input type="text" placeholder="E-mail" />
              <input type="password" placeholder="Contraseña" />
              <button>Entrar</button>
            </form>
            <form action="" class="formulario_registro">
              <h2>Registrarse</h2>
              <input type="text" placeholder="Nombre" />
              <input type="text" placeholder="Apellido" />
              <input type="text" placeholder="E-mail" />
              <input type="text" placeholder="Usuario" />
              <input type="password" placeholder="Contraseña" />
              <button>Registrarse</button>
            </form>
          </div>
        </div>
      </main>
      <div class="chatbot-container">
        <div class="chatbot-icon" onclick="toggleChatbot()"></div>
        <iframe
          class="chatbot-iframe"
          allow="microphone;"
          src="https://console.dialogflow.com/api-client/demo/embedded/af4e545c-d406-4a25-af26-d23cec7442c5"
        >
        </iframe>
        <button class="close-chatbot" onclick="toggleChatbot()">Cerrar</button>
      </div>

      <footer class="footer-gral">
        <div class="contenedor">
          <p class="copy">PawFeliz &copy; 2024</p>
          <div class="redes">
            <ul>
              <li>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
              </li>
              <li>
                <a href="#"><i class="fab fa-x-twitter"></i></a>
              </li>
              <li>
                <a href="#"><i class="fab fa-instagram"></i></a>
              </li>
              <li>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
              </li>
              <li>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
              </li>
              <li>
                <a href="#"><i class="fab fa-google"></i></a>
              </li>
              <li>
                <a href="#"><i class="fab fa-firefox"></i></a>
              </li>
            </ul>
          </div>
        </div>
      </footer>
    </body>

    <script src="js/chatbot.js"></script>
    <script src="Js/logica.js"></script>
  </html>
</html>
